name: Docker Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on release branch
        run: |
          git fetch origin release
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kohlarnhin/sub2api-panel:${{ github.ref_name }}
            ghcr.io/kohlarnhin/sub2api-panel:latest
