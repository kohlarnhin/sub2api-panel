name: Docker Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish
        required: true
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify tag is on release branch
        id: release
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            image_tag="${{ inputs.tag }}"
            tag_sha="$(git rev-list -n 1 "${image_tag}")"
          else
            image_tag="${GITHUB_REF_NAME}"
            tag_sha="${GITHUB_SHA}"
          fi
          git fetch origin release
          git merge-base --is-ancestor "${tag_sha}" origin/release
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kohlarnhin/sub2api-panel:${{ steps.release.outputs.image_tag }}
            ghcr.io/kohlarnhin/sub2api-panel:latest
